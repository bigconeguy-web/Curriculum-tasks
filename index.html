<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>

    body {

      cursor: default;
    }
  </style>
</head>
<body>
  <template id="portal-template">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      id="dynamic-favicon"
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1512'/%3E%3Cpath d='M20 42V22h8l4 8 4-8h8v20h-6V31l-4 7h-4l-4-7v11h-6z' fill='%2334d399'/%3E%3C/svg%3E"
    />
    <title>Dashboard</title>
    <style>
      :root {
        --bg-canvas: #0b0f14;
        --bg-elevated: #121821;
        --bg-card: #161e29;
        --bg-card-hover: #1c2635;
        --bg-input: #121821;
        --border: #232e3e;
        --border-hover: #34d399;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --accent: #34d399;
        --accent-hover: #10b981;
        --accent-soft: rgba(52, 211, 153, 0.14);
        --accent-contrast: #06281e;
        --shadow-card: 0 4px 14px rgba(0, 0, 0, 0.25);
        --shadow-card-hover: 0 14px 28px rgba(0, 0, 0, 0.42);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      }

      html[data-theme="light"] {
        --bg-canvas: #f8fafc;
        --bg-elevated: #ffffff;
        --bg-card: #ffffff;
        --bg-card-hover: #f1f5f9;
        --bg-input: #ffffff;
        --border: #e2e8f0;
        --border-hover: #059669;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --accent: #059669;
        --accent-hover: #047857;
        --accent-soft: rgba(5, 150, 105, 0.1);
        --accent-contrast: #ffffff;
        --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.08);
        --shadow-card-hover: 0 12px 24px rgba(15, 23, 42, 0.12);
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font-family: "Plus Jakarta Sans", "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.22s var(--ease-out), color 0.22s var(--ease-out);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--bg-elevated);
        border-bottom: 1px solid var(--border);
      }

      .topbar-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand-wordmark {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        white-space: nowrap;
        flex-shrink: 0;
        margin: 0;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 20px;
        overflow-x: auto;
      }

      .nav-btn {
        appearance: none;
        background: none;
        border: none;
        padding: 18px 2px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        position: relative;
        transition: color 0.18s var(--ease-out);
      }

      .nav-btn::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: center;
        transition: transform 0.2s var(--ease-out);
      }

      .nav-btn:hover {
        color: var(--text-primary);
      }

      .nav-btn.active {
        color: var(--accent);
      }

      .nav-btn.active::after {
        transform: scaleX(1);
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .icon-action {
        appearance: none;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.18s var(--ease-out), color 0.18s var(--ease-out), border-color 0.18s var(--ease-out);
      }

      .icon-action:hover {
        color: var(--accent);
        border-color: var(--accent);
        transform: translateY(-1px);
      }

      .icon-action:active {
        transform: translateY(0) scale(0.96);
      }

      .icon-action.spinning svg {
        animation: spinOnce 0.55s var(--ease-out);
      }

      @keyframes spinOnce {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .workspace {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 20px 64px;
      }

      .section-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .section-title {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
      }

      .meta-count {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      .filter-toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }

      .search-wrap {
        position: relative;
        flex: 1 1 260px;
      }

      .search-icon {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
      }

      .field-input,
      .field-select {
        width: 100%;
        height: 42px;
        padding: 0 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--bg-input);
        color: var(--text-primary);
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.18s var(--ease-out), box-shadow 0.18s var(--ease-out);
      }

      .search-wrap .field-input {
        padding-left: 38px;
      }

      .field-input::placeholder {
        color: var(--text-muted);
      }

      .field-input:focus,
      .field-select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .field-select {
        width: auto;
        min-width: 155px;
        cursor: pointer;
      }

      .zone-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(186px, 1fr));
        gap: 16px;
      }

      .zone-grid.compact {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }

      .zone-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        box-shadow: var(--shadow-card);
        opacity: 0;
        transform: translateY(10px);
        animation: cardEnter 0.32s var(--ease-out) forwards;
        transition: transform 0.2s var(--ease-out), border-color 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out), background-color 0.2s var(--ease-out);
        position: relative;
      }

      @keyframes cardEnter {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .zone-card:hover {
        transform: translateY(-5px);
        border-color: var(--border-hover);
        background: var(--bg-card-hover);
        box-shadow: var(--shadow-card-hover);
      }

      .zone-card:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .zone-thumb-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: var(--bg-elevated);
        overflow: hidden;
      }

      .zone-thumb {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.32s var(--ease-out), opacity 0.24s var(--ease-out);
      }

      .zone-card:hover .zone-thumb {
        transform: scale(1.06);
      }

      .zone-thumb-fallback {
        width: 100%;
        height: 100%;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 14px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        background: linear-gradient(135deg, var(--bg-elevated) 0%, var(--bg-card) 100%);
      }

      .zone-thumb-wrap.broken .zone-thumb {
        display: none;
      }

      .zone-thumb-wrap.broken .zone-thumb-fallback {
        display: flex;
      }

      .fav-toggle {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(11, 15, 20, 0.72);
        backdrop-filter: blur(6px);
        color: #e2e8f0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0.85;
        transition: transform 0.18s var(--ease-out), opacity 0.18s var(--ease-out), background-color 0.18s var(--ease-out), color 0.18s var(--ease-out);
      }

      .zone-card:hover .fav-toggle,
      .fav-toggle.active {
        opacity: 1;
      }

      .fav-toggle:hover {
        transform: scale(1.08);
        border-color: var(--accent);
        color: var(--accent);
      }

      .fav-toggle.active {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-contrast);
      }

      .zone-card-body {
        padding: 12px 13px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
        justify-content: center;
      }

      .zone-card-title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--text-primary);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .zone-card-meta {
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .empty-panel {
        padding: 48px 20px;
        text-align: center;
        background: var(--bg-elevated);
        border: 1px dashed var(--border);
        border-radius: var(--radius-md);
        color: var(--text-secondary);
        font-size: 14px;
      }

      .settings-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 18px;
        animation: panelFade 0.22s var(--ease-out);
      }

      @keyframes panelFade {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .settings-card {
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .settings-card h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
      }

      .settings-desc {
        margin: -8px 0 0;
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.45;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .preset-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .btn-preset {
        appearance: none;
        padding: 9px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: border-color 0.16s var(--ease-out), background-color 0.16s var(--ease-out), transform 0.16s var(--ease-out);
      }

      .btn-preset:hover {
        border-color: var(--accent);
        background: var(--bg-card-hover);
        transform: translateY(-1px);
      }

      .btn-preset.active {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
      }

      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .btn-primary {
        appearance: none;
        padding: 9px 16px;
        border-radius: var(--radius-sm);
        border: none;
        background: var(--accent);
        color: var(--accent-contrast);
        font-size: 13px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        transition: filter 0.16s var(--ease-out), transform 0.16s var(--ease-out);
      }

      .btn-primary:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }

      .btn-secondary {
        appearance: none;
        padding: 9px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        transition: border-color 0.16s var(--ease-out), color 0.16s var(--ease-out);
      }

      .btn-secondary:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--border);
      }

      .toggle-row:first-of-type {
        border-top: none;
        padding-top: 0;
      }

      .toggle-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .toggle-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .toggle-sub {
        font-size: 12px;
        color: var(--text-muted);
      }

      .switch-btn {
        appearance: none;
        width: 44px;
        height: 24px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        padding: 2px;
        cursor: pointer;
        flex-shrink: 0;
        transition: background-color 0.18s var(--ease-out), border-color 0.18s var(--ease-out);
        position: relative;
      }

      .switch-thumb {
        display: block;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--text-secondary);
        transition: transform 0.2s var(--ease-out), background-color 0.2s var(--ease-out);
      }

      .switch-btn[aria-checked="true"] {
        background: var(--accent);
        border-color: var(--accent);
      }

      .switch-btn[aria-checked="true"] .switch-thumb {
        transform: translateX(20px);
        background: var(--accent-contrast);
      }

      .settings-feedback {
        font-size: 13px;
        font-weight: 500;
        color: var(--accent);
        min-height: 18px;
      }

      #zoneViewer {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #000000;
        display: none;
        flex-direction: column;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.22s var(--ease-out), transform 0.22s var(--ease-out);
      }

      #zoneViewer.open {
        opacity: 1;
        transform: translateY(0);
      }

      .viewer-bar {
        background: var(--bg-elevated);
        border-bottom: 1px solid var(--border);
        padding: 8px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-shrink: 0;
      }

      .viewer-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .viewer-title-group {
        min-width: 0;
      }

      #zoneName {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #zoneId {
        display: none;
      }

      #zoneAuthor {
        display: block;
        font-size: 12px;
        color: var(--text-muted);
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #zoneAuthor:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      .viewer-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .viewer-btn {
        appearance: none;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-primary);
        font-size: 12px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        transition: border-color 0.16s var(--ease-out), color 0.16s var(--ease-out), background-color 0.16s var(--ease-out);
      }

      .viewer-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .viewer-btn-primary {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }

      #zoneFrame {
        flex: 1;
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: #000000;
      }

      #popupOverlay {
        position: fixed;
        inset: 0;
        z-index: 300;
        background: rgba(5, 8, 12, 0.72);
        backdrop-filter: blur(6px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        animation: fadeOverlay 0.18s var(--ease-out);
      }

      @keyframes fadeOverlay {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .modal-box {
        width: 100%;
        max-width: 520px;
        max-height: 82vh;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-card-hover);
        animation: modalScale 0.2s var(--ease-out);
      }

      @keyframes modalScale {
        from { opacity: 0; transform: scale(0.96) translateY(8px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }

      .modal-head {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      #popupTitle {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
      }

      #popupClose {
        appearance: none;
        width: 30px;
        height: 30px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-secondary);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      #popupClose:hover {
        color: var(--text-primary);
        border-color: var(--accent);
      }

      #popupBody {
        padding: 18px;
        overflow-y: auto;
        font-size: 14px;
        line-height: 1.6;
        color: var(--text-secondary);
      }

      #popupBody a {
        color: var(--accent);
      }

      .site-footer {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 13px;
        color: var(--text-muted);
      }

      .footer-links {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      .footer-links a {
        color: var(--text-secondary);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.16s var(--ease-out);
      }

      .footer-links a:hover {
        color: var(--accent);
      }

      .hidden {
        display: none !important;
      }

      body.no-motion *,
      body.no-motion *::before,
      body.no-motion *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }

      @media (max-width: 680px) {
        .topbar-inner {
          padding: 0 14px;
          gap: 12px;
        }
        .zone-grid {
          grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
          gap: 12px;
        }
        .viewer-controls {
          flex-wrap: wrap;

    <script>
      const container = document.getElementById('container');
      const emptyState = document.getElementById('empty-state');
      const zoneCountEl = document.getElementById('zoneCount');
      const viewHeadingEl = document.getElementById('view-heading');
      const catalogSection = document.getElementById('catalog-section');
      const settingsSection = document.getElementById('settings-section');
      const zoneViewer = document.getElementById('zoneViewer');
      let zoneFrame = document.getElementById('zoneFrame');
      const searchBar = document.getElementById('searchBar');
      const sortOptions = document.getElementById('sortOptions');
      const filterOptions = document.getElementById('filterOptions');
      const navButtons = document.querySelectorAll('.nav-btn');

      let activeView = 'all';
      let viewerOpen = false;
      let currentZoneFile = null;
      let favorites = [];

      const STORAGE_KEYS = {
        favs: 'gn_portal_favorites',
        theme: 'gn_portal_theme',
        cloakTitle: 'gn_portal_cloak_title',
        cloakIcon: 'gn_portal_cloak_icon',
        brand: 'gn_portal_brand',
        compact: 'gn_portal_compact',
        noMotion: 'gn_portal_nomotion'
      };

      const DEFAULT_FAVICON = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1512'/%3E%3Cpath d='M20 42V22h8l4 8 4-8h8v20h-6V31l-4 7h-4l-4-7v11h-6z' fill='%2334d399'/%3E%3C/svg%3E";

      const CLOAK_PRESETS = {
        docs: {
          title: 'Google Docs',
          icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%234285F4'/%3E%3Crect x='18' y='18' width='28' height='4' rx='2' fill='white'/%3E%3Crect x='18' y='28' width='28' height='4' rx='2' fill='white'/%3E%3Crect x='18' y='38' width='18' height='4' rx='2' fill='white'/%3E%3C/svg%3E"
        },
        classroom: {
          title: 'Classes',
          icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230F9D58'/%3E%3Ccircle cx='32' cy='25' r='7' fill='white'/%3E%3Cpath d='M18 46c0-7 6-11 14-11s14 4 14 11H18z' fill='white'/%3E%3C/svg%3E"
        },
        canvas: {
          title: 'Dashboard',
          icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23E13F2B'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='white' stroke-width='5' stroke-dasharray='8 5'/%3E%3C/svg%3E"
        },
        drive: {
          title: 'My Drive - Google Drive',
          icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23ffffff'/%3E%3Cpolygon points='32,12 49,42 39,42 22,12' fill='%23FBBC05'/%3E%3Cpolygon points='15,42 32,12 37,21 20,51' fill='%2334A853'/%3E%3Cpolygon points='20,51 49,51 54,42 25,42' fill='%234285F4'/%3E%3C/svg%3E"
        }
      };

      const zonesurls = [
        "https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json",
        "https://fastly.jsdelivr.net/gh/freebuisness/assets@main/zones.json",
        "https://gcore.jsdelivr.net/gh/freebuisness/assets@master/zones.json",
        "https://fastly.jsdelivr.net/gh/freebuisness/assets/zones.json"
      ];
      let zonesURL = zonesurls[Math.floor(Math.random() * zonesurls.length)];
      const coverURL = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main";
      const htmlURL = "https://cdn.jsdelivr.net/gh/freebuisness/html@main";
      let zones = [];
      let popularityData = {};

      function readStorage(key, fallback) {
        try {
          const val = localStorage.getItem(key);
          return val !== null ? val : fallback;
        } catch (e) {
          return fallback;
        }
      }

      function writeStorage(key, val) {
        try {
          localStorage.setItem(key, val);
        } catch (e) {}
      }

      function toTitleCase(str) {
        return str.replace(
          /\w\S*/g,
          text => text.charAt(0).toUpperCase() + text.substring(1).toLowerCase()
        );
      }

      function ensureBaseHref(rawHtml, baseHref) {
        if (/<base\b[^>]*href=/i.test(rawHtml)) {
          return rawHtml;
        }
        if (/<head\b[^>]*>/i.test(rawHtml)) {
          return rawHtml.replace(/(<head\b[^>]*>)/i, '$1<base href="' + baseHref + '">');
        }
        return '<base href="' + baseHref + '">' + rawHtml;
      }

      function applyCloak(title, iconUrl) {
        const nextTitle = (title || '').trim() || 'Dashboard';
        const nextIcon = (iconUrl || '').trim() || DEFAULT_FAVICON;
        document.title = nextTitle;
        const link = document.getElementById('dynamic-favicon') || document.querySelector("link[rel~='icon']");
        if (link) {
          link.href = nextIcon;
        }
        const titleInput = document.getElementById('cloak-title-input');
        const iconInput = document.getElementById('cloak-icon-input');
        if (titleInput && titleInput.value !== nextTitle) titleInput.value = nextTitle;
        if (iconInput) {
          iconInput.value = (iconUrl && !iconUrl.startsWith('data:')) ? iconUrl : '';
        }
        writeStorage(STORAGE_KEYS.cloakTitle, nextTitle);
        writeStorage(STORAGE_KEYS.cloakIcon, nextIcon);
      }

      function cloakIcon(url) {
        applyCloak(document.title, url);
      }

      function cloakName(string) {
        applyCloak(string, readStorage(STORAGE_KEYS.cloakIcon, DEFAULT_FAVICON));
      }

      function setTheme(theme) {
        const isLight = theme === 'light';
        document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
        const sw = document.getElementById('theme-switch');
        if (sw) sw.setAttribute('aria-checked', String(isLight));
        writeStorage(STORAGE_KEYS.theme, isLight ? 'light' : 'dark');
      }

      function setCompact(enabled) {
        container.classList.toggle('compact', enabled);
        const sw = document.getElementById('compact-switch');
        if (sw) sw.setAttribute('aria-checked', String(enabled));
        writeStorage(STORAGE_KEYS.compact, String(enabled));
      }

      function setNoMotion(enabled) {
        document.body.classList.toggle('no-motion', enabled);
        const sw = document.getElementById('motion-switch');
        if (sw) sw.setAttribute('aria-checked', String(enabled));
        writeStorage(STORAGE_KEYS.noMotion, String(enabled));
      }

      function loadPreferences() {
        try {
          const parsedFavs = JSON.parse(readStorage(STORAGE_KEYS.favs, '[]'));
          if (Array.isArray(parsedFavs)) favorites = parsedFavs;
        } catch (e) {}

        setTheme(readStorage(STORAGE_KEYS.theme, 'dark'));
        setCompact(readStorage(STORAGE_KEYS.compact, 'false') === 'true');
        setNoMotion(readStorage(STORAGE_KEYS.noMotion, 'false') === 'true');

        const savedBrand = readStorage(STORAGE_KEYS.brand, 'Dashboard');
        document.getElementById('portal-brand').textContent = savedBrand;
        document.getElementById('brand-name-input').value = savedBrand;

        const savedTitle = readStorage(STORAGE_KEYS.cloakTitle, 'Dashboard');
        const savedIcon = readStorage(STORAGE_KEYS.cloakIcon, DEFAULT_FAVICON);
        applyCloak(savedTitle, savedIcon);
      }

      function switchView(view) {
        activeView = view;
        navButtons.forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-view') === view);
        });

        if (view === 'settings') {
          catalogSection.classList.add('hidden');
          settingsSection.classList.remove('hidden');
          return;
        }

        settingsSection.classList.add('hidden');
        catalogSection.classList.remove('hidden');

        if (view === 'featured') {
          viewHeadingEl.textContent = 'Featured Games';
        } else if (view === 'favorites') {
          viewHeadingEl.textContent = 'Favorites';
        } else {
          viewHeadingEl.textContent = 'All Games';
        }

        renderActiveList();
      }

      function isFavorite(id) {
        return favorites.indexOf(String(id)) !== -1;
      }

      function toggleFavorite(id) {
        const key = String(id);
        const idx = favorites.indexOf(key);
        if (idx === -1) {
          favorites.push(key);
        } else {
          favorites.splice(idx, 1);
        }
        writeStorage(STORAGE_KEYS.favs, JSON.stringify(favorites));
        renderActiveList();
      }

      function getFilteredZones() {
        const query = (searchBar.value || '').trim().toLowerCase();
        const tag = filterOptions.value;
        let list = zones.slice();

        if (activeView === 'featured') {
          list = list.filter(z => Boolean(z.featured));
        } else if (activeView === 'favorites') {
          list = list.filter(z => isFavorite(z.id));
        }

        if (tag && tag !== 'none') {
          list = list.filter(z => Array.isArray(z.special) && z.special.includes(tag));
        }

        if (query) {
          list = list.filter(z =>
            (z.name && z.name.toLowerCase().includes(query)) ||
            (z.author && z.author.toLowerCase().includes(query))
          );
        }

        return list;
      }

      function renderActiveList() {
        const filtered = getFilteredZones();
        displayZones(filtered);
      }

      async function listZones() {
        const refreshBtn = document.getElementById('refresh');
        if (refreshBtn) {
          refreshBtn.classList.remove('spinning');
          void refreshBtn.offsetWidth;
          refreshBtn.classList.add('spinning');
        }
        try {
          let sharesponse;
          let shajson;
          let sha;
          try {
            sharesponse = await fetch("https://api.github.com/repos/freebuisness/assets/commits?t=" + Date.now());
          } catch (error) {}
          if (sharesponse && sharesponse.status === 200) {
            try {
              shajson = await sharesponse.json();
              sha = shajson[0]['sha'];
              if (sha) {
                zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
              }
            } catch (error) {
              try {
                let secondarysharesponse = await fetch("https://raw.githubusercontent.com/freebuisness/xml/refs/heads/main/sha.txt?t=" + Date.now());
                if (secondarysharesponse && secondarysharesponse.status === 200) {
                  sha = (await secondarysharesponse.text()).trim();
                  if (sha) {
                    zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
                  }
                }
              } catch (err) {}
            }
          }

          const response = await fetch(zonesURL + "?t=" + Date.now());
          const json = await response.json();
          zones = json;
          if (zones.length > 0) {
            zones[0].featured = true;
          }
          await Promise.all([
            fetchPopularity("year"),
            fetchPopularity("month"),
            fetchPopularity("week"),
            fetchPopularity("day")
          ]);
          sortZones();

          let alltags = [];
          for (const obj of json) {
            if (Array.isArray(obj.special)) {
              alltags.push(...obj.special);
            }
          }
          alltags = [...new Set(alltags)];
          while (filterOptions.children.length > 1) {
            filterOptions.removeChild(filterOptions.lastElementChild);
          }
          for (const tag of alltags) {
            const opt = document.createElement("option");
            opt.value = tag;
            opt.textContent = toTitleCase(tag);
            filterOptions.appendChild(opt);
          }

          const dataFeedback = document.getElementById('data-feedback');
          if (dataFeedback && activeView === 'settings') {
            dataFeedback.textContent = `Loaded ${zones.length} games.`;
          }
        } catch (error) {
          console.error(error);
          zoneCountEl.textContent = 'Failed to load';
          emptyState.textContent = `Error loading games: ${error}`;
          emptyState.classList.remove('hidden');
        }
      }

      async function fetchPopularity(duration) {
        try {
          if (!popularityData[duration]) {
            popularityData[duration] = {};
          }
          const response = await fetch(
            "https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files?period=" + duration
          );
          const data = await response.json();
          data.forEach(file => {
            const idMatch = file.name.match(/\/(\d+)\.html$/);
            if (idMatch) {
              const id = parseInt(idMatch[1], 10);
              popularityData[duration][id] = file.hits?.total ?? 0;
            }
          });
        } catch (error) {
          if (!popularityData[duration]) {
            popularityData[duration] = {};
          }
          popularityData[duration][0] = 0;
        }
      }

      function sortZones() {
        const sortBy = sortOptions.value;
        if (sortBy === 'name') {
          zones.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sortBy === 'id') {
          zones.sort((a, b) => a.id - b.id);
        } else if (sortBy === 'popular') {
          zones.sort((a, b) => ((popularityData['year']?.[b.id]) ?? 0) - ((popularityData['year']?.[a.id]) ?? 0));
        } else if (sortBy === 'trendingMonth') {
          zones.sort((a, b) => ((popularityData['month']?.[b.id]) ?? 0) - ((popularityData['month']?.[a.id]) ?? 0));
        } else if (sortBy === 'trendingWeek') {

      function sanitizeData(obj, maxStringLen = 1000, maxArrayLen = 10000) {
        if (typeof obj === 'string') {
          return obj.length > maxStringLen ? obj.slice(0, maxStringLen) + '...[truncated]' : obj;
        }
        if (obj instanceof Uint8Array) {
          if (obj.length > maxArrayLen) {
            return `[Uint8Array too large (${obj.length} bytes), truncated]`;
          }
          return obj;
        }
        if (Array.isArray(obj)) {
          return obj.map(item => sanitizeData(item, maxStringLen, maxArrayLen));
        }
        if (obj && typeof obj === 'object') {
          const newObj = {};
          for (const key in obj) {
            if (Object.prototype.hasOwnProperty.call(obj, key)) {
              newObj[key] = sanitizeData(obj[key], maxStringLen, maxArrayLen);
            }
          }
          return newObj;
        }
        return obj;
      }

      async function saveData() {
        const feedbackEl = document.getElementById('data-feedback');
        if (feedbackEl) feedbackEl.textContent = 'Preparing data export...';
        const result = {};
        result.cookies = document.cookie;
        result.localStorage = { ...localStorage };
        result.sessionStorage = { ...sessionStorage };
        result.indexedDB = {};
        try {
          const dbs = await indexedDB.databases();
          for (const dbInfo of dbs) {
            if (!dbInfo.name) continue;
            result.indexedDB[dbInfo.name] = {};
            await new Promise((resolve, reject) => {
              const openRequest = indexedDB.open(dbInfo.name, dbInfo.version);
              openRequest.onerror = () => reject(openRequest.error);
              openRequest.onsuccess = () => {
                const db = openRequest.result;
                const storeNames = Array.from(db.objectStoreNames);
                if (storeNames.length === 0) {
                  resolve();
                  return;
                }
                const transaction = db.transaction(storeNames, "readonly");
                const storePromises = [];
                for (const storeName of storeNames) {
                  result.indexedDB[dbInfo.name][storeName] = [];
                  const store = transaction.objectStore(storeName);
                  const getAllRequest = store.getAll();
                  const p = new Promise((res, rej) => {
                    getAllRequest.onsuccess = () => {
                      result.indexedDB[dbInfo.name][storeName] = sanitizeData(getAllRequest.result, 1000, 100);
                      res();
                    };
                    getAllRequest.onerror = () => rej(getAllRequest.error);
                  });
                  storePromises.push(p);
                }
                Promise.all(storePromises).then(() => resolve());
              };
            });
          }
        } catch (e) {}

        result.caches = {};
        try {
          const cacheNames = await caches.keys();
          for (const cacheName of cacheNames) {
            const cache = await caches.open(cacheName);
            const requests = await cache.keys();
            result.caches[cacheName] = [];
            for (const req of requests) {
              const response = await cache.match(req);
              if (!response) continue;
              const cloned = response.clone();
              const contentType = cloned.headers.get('content-type') || '';
              let body;
              try {
                if (contentType.includes('application/json')) {
                  body = await cloned.json();
                } else if (contentType.includes('text') || contentType.includes('javascript')) {
                  body = await cloned.text();
                } else {
                  const buffer = await cloned.arrayBuffer();
                  body = btoa(String.fromCharCode(...new Uint8Array(buffer)));
                }
              } catch (e) {
                body = '[Unable to read body]';
              }
              result.caches[cacheName].push({ url: req.url, body, contentType });
            }
          }
        } catch (e) {}

        const link = document.createElement("a");
        link.href = URL.createObjectURL(new Blob([JSON.stringify(result)], { type: "application/octet-stream" }));
        link.download = `${Date.now()}.data`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        if (feedbackEl) feedbackEl.textContent = 'Save data exported.';
      }

      async function loadData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const feedbackEl = document.getElementById('data-feedback');
        if (feedbackEl) feedbackEl.textContent = 'Importing save data...';
        const reader = new FileReader();
        reader.onload = async function (e) {
          const data = JSON.parse(e.target.result);
          if (data.cookies) {
            data.cookies.split(';').forEach(cookie => {
              document.cookie = cookie.trim();
            });
          }
          if (data.localStorage) {
            for (const key in data.localStorage) {
              localStorage.setItem(key, data.localStorage[key]);
            }
          }
          if (data.sessionStorage) {
            for (const key in data.sessionStorage) {
              sessionStorage.setItem(key, data.sessionStorage[key]);
            }
          }
          if (data.indexedDB) {
            for (const dbName in data.indexedDB) {
              const stores = data.indexedDB[dbName];
              await new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onupgradeneeded = ev => {
                  const db = ev.target.result;
                  for (const storeName in stores) {
                    if (!db.objectStoreNames.contains(storeName)) {
                      db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
                    }
                  }
                };
                request.onsuccess = ev => {
                  const db = ev.target.result;
                  const transaction = db.transaction(Object.keys(stores), 'readwrite');
                  transaction.onerror = () => reject(transaction.error);
                  let pendingStores = Object.keys(stores).length;
                  if (pendingStores === 0) { resolve(); return; }
                  for (const storeName in stores) {
                    const objectStore = transaction.objectStore(storeName);
                    objectStore.clear().onsuccess = () => {
                      for (const item of stores[storeName]) {
                        objectStore.put(item);
                      }
                      pendingStores--;
                      if (pendingStores === 0) resolve();
                    };
                  }
                };
                request.onerror = () => reject(request.error);
              });
            }
          }
          if (data.caches) {
            for (const cacheName in data.caches) {
              const cache = await caches.open(cacheName);
              await cache.keys().then(keys => Promise.all(keys.map(k => cache.delete(k))));
              for (const entry of data.caches[cacheName]) {
                let responseBody;
                if (entry.contentType.includes('application/json')) {
                  responseBody = JSON.stringify(entry.body);
                } else if (entry.contentType.includes('text') || entry.contentType.includes('javascript')) {
                  responseBody = entry.body;
                } else {
                  const binaryStr = atob(entry.body);
                  const len = binaryStr.length;
                  const bytes = new Uint8Array(len);
                  for (let i = 0; i < len; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                  }
                  responseBody = bytes.buffer;
                }
                const headers = new Headers({ 'content-type': entry.contentType });
                const response = new Response(responseBody, { headers });
                await cache.put(entry.url, response);
              }
            }
          }
          loadPreferences();
          renderActiveList();
          if (feedbackEl) feedbackEl.textContent = 'Save data imported.';
        };
        reader.readAsText(file);
      }

      let _allStatsCache = null;

      async function getAllStats() {
        if (_allStatsCache) return _allStatsCache;
        const BASE_URL = "https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files";
        const PERIOD = "year";
        const PAGE_BATCH = 5;
        let page = 1;
        let done = false;
        const combinedMap = Object.create(null);

        while (!done) {
          const pages = Array.from({ length: PAGE_BATCH }, (_, i) => page + i);
          const responses = await Promise.all(
            pages.map(p => fetch(`${BASE_URL}?period=${PERIOD}&page=${p}&limit=100`).then(r => (r.ok ? r.json() : [])))
          );
          for (const data of responses) {
            if (!Array.isArray(data) || data.length === 0) {
              done = true;
              break;
            }
            for (const item of data) {
              if (!item?.name) continue;
              const match = item.name.match(/^\/(\d+)([.-])/);
              if (!match) continue;
              const id = match[1];
              if (!combinedMap[id]) combinedMap[id] = { hits: 0, bandwidth: 0 };
              combinedMap[id].hits += item.hits?.total ?? 0;
              combinedMap[id].bandwidth += item.bandwidth?.total ?? 0;
            }
          }
          page += PAGE_BATCH;
        }
        _allStatsCache = combinedMap;
        return combinedMap;
      }

      async function getStats(id) {
        const allStats = await getAllStats();
        return allStats[String(id)]?.hits ?? 0;
      }
